<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindPulse — Mental Health Score Predictor</title>
  <meta name="description" content="Predict your mental wellness score using your social media habits, sleep patterns, and lifestyle data powered by machine learning." />

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Theme flash prevention -->
  <script>
    (function () {
      const t = localStorage.getItem('mp-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- JS builds all UI into #root -->
  <div id="root"></div>
  <script src="script.js"></script>
</body>
</html>
